[workspace]
resolver = "2"
members = ["backend-shared", "app-bindings", "meta-gen", "wasm", "webserver", "app", "viz-wasm"]
# `app` (tauri) excluded: requires system GUI libs. Build via `cargo tauri build`.
# `meta-gen` excluded: codegen tool, prevents `preserve_order` unifying into runtime crates.
default-members = ["backend-shared", "app-bindings", "webserver"]

# One source for every crate: `inventory` registries only unify across identical package sources.
# `default-features = false` so `viz-wasm` can stay minimal; the other crates list theirs.
[workspace.dependencies]
# Unreleased: graphlay 0.4.0. Back to the crates.io version with the next release.
process_mining = { git = "https://github.com/aarkue/rust4pm", rev = "9c1758483047c7aa426286ad764ade2f2bfcdeb1", default-features = false }

[profile.release]
opt-level = 3

# Force single-unit codegen to ensure all inventory registrations are linked at opt-level 3.
[profile.release.package.app-bindings]
codegen-units = 1

