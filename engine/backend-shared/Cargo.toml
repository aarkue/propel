[package]
name = "backend-shared"
version = "0.1.0"
edition = "2021"


[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
process_mining = { git = "https://github.com/aarkue/rust4pm.git", branch = "feat/extraction-blueprints", features = ["bindings", "extraction-blueprint", "ocel-bundle", "ocel-bundle-parquet"] }
schemars = "1.1.0"

[features]
default = ["bindings"]
# Present so the `#[register_binding]` macro's `cfg(feature = "bindings")` gate resolves in this
# crate (e.g. a test-only binding); process_mining/bindings is already forced by the dependency.
bindings = ["process_mining/bindings"]
ocel-sqlite = ["process_mining/ocel-sqlite"]
# Live dbcon-backed extraction (catalog discovery, run). Left off by default: pulls in dbcon's
# git-pinned sqlx/sea-schema tree, which the workspace root's `[patch]` block exists to unblock.
# The file-backed connector: SQLite, CSV and Parquet, all readable from bytes and all buildable
# for wasm32. Safe for every target.
extraction-blueprint-dbcon = ["process_mining/extraction-dbcon"]
# DuckDB has no wasm32 build, so it is opt-in like PostgreSQL. Statically linked (`-bundled`):
# this ships in installed desktop/webserver binaries, which can't assume a user has libduckdb.
extraction-blueprint-dbcon-duckdb = [
    "extraction-blueprint-dbcon",
    "process_mining/extraction-dbcon-duckdb-bundled",
]

# Adds PostgreSQL, which pulls `sqlx` and does not build for wasm32. Native backends only.
extraction-blueprint-dbcon-postgres = [
    "extraction-blueprint-dbcon",
    "process_mining/extraction-dbcon-postgres",
]
